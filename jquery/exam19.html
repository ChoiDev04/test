<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계산기</title>
</head>
<style>
    h1 { text-align: center; }
    .disp { width: 205px; height: 40px; margin-top: 3px; }
    .disp { font-family: "Oxanium", sans-serif; font-size: 22pt; text-align: center; }
    input[type=button] { width: 50px; height: 50px; text-align: center;
        vertical-align: middle; margin-top: 5px; }
        #calc { width: 220px; margin-left: auto; margin-right: auto;}
</style>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script>
    $(document).ready(function() {
        $('.num').click(function() {
            let cur = $('#disp2').val();
            let n = $(this).val();
            $('#disp2').val(cur + n);
        });
        $('.op').click(function() {
            let cur = $('#disp2').val();
            let opt = $(this).val();
            if (opt != "=") $('#disp2').val(cur + opt);
            else {
                $('#disp1').val(cur); 
                // $('#disp2').val(eval(cur));
                // $('#disp2').val(new Function('return ' + cur)()); 뭔가 eval이랑 같지 않나?

                let sep = cur.match(/(\d+|\+|\-|\*|\/)/g);

                if (sep) {
                    for (let i = 0; i < sep.length; i++) {
                        if (sep[i] === '*' || sep[i] === '/') {
                            let prev = Number(sep[i-1]);
                            let next = Number(sep[i+1]);
                            let solve = (sep[i] === '*') ? (prev * next) : (prev / next);

                            sep.splice(i-1, 3, solve);
                            i--;
                        }
                    }
                    //console.log('sep=', sep);

                    let result = Number(sep[0]);
                    for (let i = 1; i < sep.length; i += 2) {
                        let op = sep[i];
                        let next = Number(sep[i + 1]);
                        if (op === '+') result += next;
                        if (op === '-') result -= next;
                        //console.log('op=', op);
                    }

                    $('#disp2').val(result);
                }
            }
        });

        //AC 집가서 구현하기
        $('.func').click(function() {
            if ($(this).val() == 'AC') {
                $('#disp1').val('');
                $('#disp2').val('');
            }
        });
    });
</script>
<body>
    <h1>계산기</h1>
    <div id="calc">
        <div>
            <input type="text" class="disp" id="disp1" readonly>
            <input type="text" class="disp" id="disp2" readonly>
        </div>
        <input type="button" class="num" value="7">
        <input type="button" class="num" value="8">
        <input type="button" class="num" value="9">
        <input type="button" class="op" value="+"><br>
        <input type="button" class="num" value="4">
        <input type="button" class="num" value="5">
        <input type="button" class="num" value="6">
        <input type="button" class="op" value="-"><br>
        <input type="button" class="num" value="1">
        <input type="button" class="num" value="2">
        <input type="button" class="num" value="3">
        <input type="button" class="op" value="*"><br>
        <input type="button" class="func" value="AC">
        <input type="button" class="num" value="0">
        <input type="button" class="op" value="=">
        <input type="button" class="op" value="/">
    </div>

</body>
</html>
